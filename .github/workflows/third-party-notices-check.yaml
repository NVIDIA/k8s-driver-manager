name: Third-Party Notices Check

on:
  workflow_call: {}

jobs:
  check-third-party-notices:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get Golang version
        id: vars
        run: |
          GOLANG_VERSION=$(./scripts/golang-version.sh)
          echo "GOLANG_VERSION=${GOLANG_VERSION##GOLANG_VERSION := }" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Setup Go Proxy
        id: setup-go-proxy
        uses: nv-gha-runners/setup-artifactory-go-proxy@a15ec16ff434e8ca3b0f76919f902080e66ebc14 # main

      - name: Verify THIRD_PARTY_NOTICES.md is up to date
        env:
          GOPROXY: ${{ steps.setup-go-proxy.outputs.goproxy-url }}
        run: make check-third-party-notices
